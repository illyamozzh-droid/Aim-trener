name: Android Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup and Export
        run: |
          set -e
          export HOME=/root
          mkdir -p /root/.android /root/.local/share/godot/export_templates/4.4.1.stable /root/.config/godot build

          echo "=== DIAGNOSTIC ==="
          pwd
          ls -la
          find /root /usr/local /home /github -maxdepth 5 2>/dev/null | grep -E "template|android|godot" || true
          ls -la /usr/lib/android-sdk/build-tools 2>/dev/null || true
          ls -la /usr/lib/android-sdk/platforms 2>/dev/null || true

          keytool -genkeypair -noprompt -v -keystore /root/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          for f in $(find /root /usr/local /home /github -name "android_debug.apk" -o -name "android_release.apk" 2>/dev/null); do
            cp -f "$f" /root/.local/share/godot/export_templates/4.4.1.stable/
          done
          ls -la /root/.local/share/godot/export_templates/4.4.1.stable/

          cat << 'EOF' > /root/.config/godot/editor_settings-4.4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/debug_keystore = "/root/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/release_keystore = "/root/.android/debug.keystore"
          export/android/release_keystore_user = "androiddebugkey"
          export/android/release_keystore_pass = "android"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          EOF

          cat << 'EOF' > export_presets.cfg
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/spatial_simulator.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0.0"
          package/unique_name="org.example.spatialaccuracy"
          package/name="Spatial Accuracy Simulator"
          package/signed=true
          screen/immersive_mode=true
          screen/orientation=0
          textures/vram_compression/import_etc2_astc=true
          keystore/debug="/root/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release="/root/.android/debug.keystore"
          keystore/release_user="androiddebugkey"
          keystore/release_password="android"
          EOF

          godot --headless --export-debug "Android" build/spatial_simulator.apk
          ls -lh build/spatial_simulator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spatial-simulator-debug-apk
          path: build/spatial_simulator.apk
