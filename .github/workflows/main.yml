name: Android Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fix Templates and Java SDK
        run: |
          mkdir -p /root/.android /github/home/.local/share/godot/export_templates/4.4.1.stable /github/home/.config/godot
          if [ ! -f /root/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore /root/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          sed -i 's|/home/runner/.android/debug.keystore|/root/.android/debug.keystore|g' export_presets.cfg

          for dir in /root/.local/share/godot/export_templates/4.4.1.stable /root/.local/share/godot/export_templates/4.4.1.stable.mono; do
            if [ -d "$dir" ] && [ "$(ls -A "$dir" 2>/dev/null)" ]; then
              cp -rn "$dir"/* /github/home/.local/share/godot/export_templates/4.4.1.stable/ || true
            fi
          done

          if [ ! -f /github/home/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk ]; then
            curl -fL "https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o /tmp/templates.zip
            unzip -q /tmp/templates.zip -d /tmp/templates_tmp
            cp -rn /tmp/templates_tmp/templates/* /github/home/.local/share/godot/export_templates/4.4.1.stable/
          fi

          JAVA_BIN=$(command -v java || true)
          JAVA_HOME_PATH=""
          if [ -n "$JAVA_BIN" ]; then
            REAL_JAVA=$(readlink -f "$JAVA_BIN")
            JAVA_HOME_PATH=$(dirname "$(dirname "$REAL_JAVA")")
          fi
          echo "Detected JAVA_HOME: $JAVA_HOME_PATH"

          cat << 'EOF' > /github/home/.config/godot/editor_settings-4.4.tres
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/debug_keystore = "/root/.android/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF

          if [ -n "$JAVA_HOME_PATH" ]; then
            printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME_PATH" >> /github/home/.config/godot/editor_settings-4.4.tres
          fi

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/spatial_simulator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spatial-simulator-apk
          path: build/spatial_simulator.apk
