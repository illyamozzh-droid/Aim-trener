name: Android Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download Godot
        run: |
          curl -fL "https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64

      - name: Install Godot Export Templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -fL "https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o templates.zip
          unzip -q templates.zip -d templates_tmp
          mv templates_tmp/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Setup Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare Debug Keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Initialize and Configure Godot
        run: |
          timeout 25s ./Godot_v4.4.1-stable_linux.x86_64 --headless --editor --quit || true
          python3 -c '
          import os, glob
          cfg_dir = os.path.expanduser("~/.config/godot")
          os.makedirs(cfg_dir, exist_ok=True)
          files = glob.glob(os.path.join(cfg_dir, "editor_settings*.tres")) or [os.path.join(cfg_dir, "editor_settings-4.4.tres")]
          extra = """
          export/android/android_sdk_path = "/home/runner/android-sdk"
          export/android/debug_keystore = "/home/runner/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          """
          for p in files:
              txt = open(p).read() if os.path.exists(p) else "[gd_resource type=\"EditorSettings\" format=3]\n\n[resource]\n"
              if "[resource]" not in txt:
                  txt += "\n[resource]\n"
              with open(p, "w") as f:
                  f.write(txt + "\n".join(l.strip() for l in extra.splitlines()) + "\n")
          '

      - name: Export APK
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: |
          mkdir -p build
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --verbose --export-debug "Android" build/spatial_simulator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spatial-simulator-apk
          path: build/spatial_simulator.apk
