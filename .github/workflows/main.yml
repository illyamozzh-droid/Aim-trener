name: Android Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup and Export
        run: |
          export HOME=/root
          mkdir -p /root/.android /home/runner/.android /root/.local/share/godot/export_templates/4.4.1.stable /root/.config/godot build

          if [ ! -f /root/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore /root/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp -f /root/.android/debug.keystore /home/runner/.android/debug.keystore

          for src in /root/.local/share/godot/export_templates/4.4.1.stable /root/.local/share/godot/export_templates/4.4.1.stable.mono /usr/local/share/godot/templates/4.4.1.stable /github/home/.local/share/godot/export_templates/4.4.1.stable; do
            if [ -d "$src" ] && [ "$src" != "/root/.local/share/godot/export_templates/4.4.1.stable" ]; then
              cp -rn "$src"/* /root/.local/share/godot/export_templates/4.4.1.stable/ 2>/dev/null || true
            fi
          done

          JAVA_HOME_PATH="/usr/lib/jvm/java-17-openjdk-amd64"
          SDK_PATH="/usr/lib/android-sdk"
          export JAVA_HOME="$JAVA_HOME_PATH"
          export ANDROID_HOME="$SDK_PATH"
          export ANDROID_SDK_ROOT="$SDK_PATH"

          cat << EOF > /root/.config/godot/editor_settings-4.4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/debug_keystore = "/root/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/release_keystore = "/root/.android/debug.keystore"
          export/android/release_keystore_user = "androiddebugkey"
          export/android/release_keystore_pass = "android"
          export/android/java_sdk_path = "$JAVA_HOME_PATH"
          export/android/android_sdk_path = "$SDK_PATH"
          EOF

          cat << 'EOF' > export_presets.cfg
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/spatial_simulator.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0.0"
          package/unique_name="org.example.spatialaccuracy"
          package/name="Spatial Accuracy Simulator"
          package/signed=true
          screen/immersive_mode=true
          screen/orientation=0
          textures/vram_compression/import_etc2_astc=true
          keystore/debug="/root/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release="/root/.android/debug.keystore"
          keystore/release_user="androiddebugkey"
          keystore/release_password="android"
          EOF

          godot --headless --verbose --export-debug "Android" build/spatial_simulator.apk 2>&1 | tee /tmp/godot_export.log
          echo "=== LINES AROUND configuration errors ==="
          grep -n -C 5 "configuration errors" /tmp/godot_export.log || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spatial-simulator-debug-apk
          path: build/spatial_simulator.apk
