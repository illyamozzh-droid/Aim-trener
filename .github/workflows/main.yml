name: Build Android Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK (Godot 4.4.1)
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.4.1

    env:
      HOME: /github/home
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          test -f project.godot
          test -x /usr/local/bin/godot
          test -d "$ANDROID_HOME/platforms/android-33"
          test -d "$ANDROID_HOME/build-tools/33.0.2"
          test -x "$JAVA_HOME/bin/java"

          GODOT_VERSION="$(/usr/local/bin/godot --version)"

          if [[ "$GODOT_VERSION" != 4.4.1* ]]; then
            echo "::error::Expected Godot 4.4.1, got $GODOT_VERSION"
            exit 1
          fi

          echo "Godot: $GODOT_VERSION"
          echo "HOME: $HOME"
          echo "Android SDK: $ANDROID_HOME"
          echo "Java: $JAVA_HOME"

      - name: Install Android export templates into HOME
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="/root/.local/share/godot/export_templates/4.4.1.stable"
          DEST="$HOME/.local/share/godot/export_templates/4.4.1.stable"

          if [[ ! -d "$SOURCE" ]]; then
            echo "::error::Source export templates not found: $SOURCE"
            exit 1
          fi

          mkdir -p "$DEST"

          SOURCE_REAL="$(realpath "$SOURCE")"
          DEST_REAL="$(realpath "$DEST")"

          if [[ "$SOURCE_REAL" != "$DEST_REAL" ]]; then
            echo "Copying export templates:"
            echo "$SOURCE"
            echo "-> $DEST"

            cp -a "$SOURCE/." "$DEST/"
          else
            echo "Source and destination are identical. Skipping copy."
          fi

          for TEMPLATE in android_debug.apk android_release.apk; do
            if [[ ! -s "$DEST/$TEMPLATE" ]]; then
              echo "::error::Missing export template: $DEST/$TEMPLATE"
              exit 1
            fi
          done

          if [[ ! -s "$DEST/version.txt" ]]; then
            echo "4.4.1.stable" > "$DEST/version.txt"
          fi

          echo "Installed templates:"
          ls -lh "$DEST"

      - name: Configure Android debug keystore
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -s /root/debug.keystore ]] || \
             ! keytool -list \
               -keystore /root/debug.keystore \
               -storepass android \
               -alias androiddebugkey >/dev/null 2>&1; then

            rm -f /root/debug.keystore

            keytool -genkeypair \
              -noprompt \
              -v \
              -keystore /root/debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          chmod 600 /root/debug.keystore

          keytool -list \
            -keystore /root/debug.keystore \
            -storepass android \
            -alias androiddebugkey

      - name: Configure Godot Android editor settings
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          EOF

          test -s "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Configure Android project settings
        shell: bash
        run: |
          set -euo pipefail

          # ETC2/ASTC compression is required for Android export.
          # Ensure the setting is in project.godot, not export_presets.cfg.

          awk '
            BEGIN {
              in_rendering = 0
              found_rendering = 0
              found_setting = 0
            }

            /^\[rendering\]$/ {
              in_rendering = 1
              found_rendering = 1
              print
              next
            }

            /^\[/ {
              if (in_rendering && !found_setting) {
                print "textures/vram_compression/import_etc2_astc=true"
                found_setting = 1
              }
              in_rendering = 0
            }

            in_rendering && /^textures\/vram_compression\/import_etc2_astc=/ {
              if (!found_setting) {
                print "textures/vram_compression/import_etc2_astc=true"
              }
              found_setting = 1
              next
            }

            {
              print
            }

            END {
              if (in_rendering && !found_setting) {
                print "textures/vram_compression/import_etc2_astc=true"
              }

              if (!found_rendering) {
                print "\n[rendering]\ntextures/vram_compression/import_etc2_astc=true"
              }
            }
          ' project.godot > project.godot.tmp

          mv project.godot.tmp project.godot

      - name: Create Android export preset
        shell: bash
        run: |
          set -euo pipefail

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/spatial_simulator.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false

          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          version/code=1
          version/name="1.0.0"

          package/unique_name="org.example.spatialaccuracy"
          package/name="Spatial Accuracy Simulator"
          package/signed=true

          screen/immersive_mode=true
          screen/orientation=0

          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""

          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          EOF

          test -s export_presets.cfg

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail

          /usr/local/bin/godot \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE" \
            --import \
            --quit

      - name: Export Android Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          mkdir -p build
          rm -f build/spatial_simulator.apk

          echo "Starting Android Debug APK export..."

          /usr/local/bin/godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug \
            "Android" \
            "build/spatial_simulator.apk"

          if [[ ! -s build/spatial_simulator.apk ]]; then
            echo "::error::APK was not created!"
            exit 1
          fi

          unzip -tq build/spatial_simulator.apk

          echo "APK successfully created:"
          ls -lh build/spatial_simulator.apk

          echo "SHA256:"
          sha256sum build/spatial_simulator.apk

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spatial-simulator-debug-apk
          path: build/spatial_simulator.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
