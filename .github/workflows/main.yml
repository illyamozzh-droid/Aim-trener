name: Build Android Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK (Godot 4.4.1)
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.4.1

    env:
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Godot and Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f project.godot ]]; then
            echo "::error::project.godot not found in repository root"
            exit 1
          fi

          if [[ ! -x /usr/local/bin/godot ]]; then
            echo "::error::Godot binary not found at /usr/local/bin/godot"
            exit 1
          fi

          GODOT_VERSION="$(/usr/local/bin/godot --version | head -n 1)"

          if [[ "$GODOT_VERSION" != 4.4.1* ]]; then
            echo "::error::Expected Godot 4.4.1, found: $GODOT_VERSION"
            exit 1
          fi

          if [[ ! -d "$ANDROID_HOME/platforms/android-33" ]]; then
            echo "::error::Android SDK platform android-33 not found"
            exit 1
          fi

          if [[ ! -d "$ANDROID_HOME/build-tools/33.0.2" ]]; then
            echo "::error::Android Build Tools 33.0.2 not found"
            exit 1
          fi

          if [[ ! -x "$JAVA_HOME/bin/java" ]] || [[ ! -x "$JAVA_HOME/bin/javac" ]]; then
            echo "::error::Java JDK 17 not found at $JAVA_HOME"
            exit 1
          fi

          if [[ ! -s /root/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk ]]; then
            echo "::error::Godot Android debug export template not found"
            exit 1
          fi

          echo "Godot: $GODOT_VERSION"
          echo "Android SDK: $ANDROID_HOME"
          echo "Java SDK: $JAVA_HOME"
          echo "Android Build Tools: 33.0.2"

      - name: Configure Android debug keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /root

          if [[ ! -s /root/debug.keystore ]] || \
             ! keytool -list \
               -keystore /root/debug.keystore \
               -storepass android \
               -alias androiddebugkey >/dev/null 2>&1; then

            rm -f /root/debug.keystore

            keytool -genkeypair \
              -noprompt \
              -v \
              -keystore /root/debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          chmod 600 /root/debug.keystore

          keytool -list \
            -keystore /root/debug.keystore \
            -storepass android \
            -alias androiddebugkey

      - name: Configure Godot editor settings
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /root/.config/godot

          cat > /root/.config/godot/editor_settings-4.4.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          EOF

          test -s /root/.config/godot/editor_settings-4.4.tres

      - name: Configure Android export preset
        shell: bash
        run: |
          set -euo pipefail

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/spatial_simulator.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/min_sdk="24"
          gradle_build/target_sdk="33"

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          version/code=1
          version/name="1.0.0"

          package/unique_name="org.example.spatialaccuracy"
          package/name="Spatial Accuracy Simulator"
          package/signed=true

          screen/immersive_mode=true
          screen/orientation=0

          textures/vram_compression/import_etc2_astc=true

          keystore/debug="/root/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"

          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          EOF

          test -s export_presets.cfg

      - name: Import Godot project resources
        shell: bash
        run: |
          set -euo pipefail

          /usr/local/bin/godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --editor \
            --import \
            --quit

      - name: Export Android Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          mkdir -p build
          rm -f build/spatial_simulator.apk

          /usr/local/bin/godot \
            --headless \
            --export-debug \
            "Android" \
            build/spatial_simulator.apk

          if [[ ! -s build/spatial_simulator.apk ]]; then
            echo "::error::Android APK was not created: build/spatial_simulator.apk"
            exit 1
          fi

          unzip -tq build/spatial_simulator.apk

          echo "APK successfully created:"
          ls -lh build/spatial_simulator.apk
          sha256sum build/spatial_simulator.apk

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spatial-simulator-debug-apk
          path: build/spatial_simulator.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
