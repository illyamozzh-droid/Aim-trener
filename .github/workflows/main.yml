name: Android Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup and Export
        run: |
          export HOME=/root
          mkdir -p /root/.android /root/.local/share/godot/export_templates/4.4.1.stable /root/.config/godot build

          if [ ! -f /root/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore /root/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          for src in /root/.local/share/godot/export_templates/4.4.1.stable /root/.local/share/godot/export_templates/4.4.1.stable.mono /usr/local/share/godot/templates/4.4.1.stable /github/home/.local/share/godot/export_templates/4.4.1.stable; do
            if [ -d "$src" ] && [ "$src" != "/root/.local/share/godot/export_templates/4.4.1.stable" ]; then
              cp -rn "$src"/* /root/.local/share/godot/export_templates/4.4.1.stable/ 2>/dev/null || true
            fi
          done

          JAVA_HOME_PATH="/usr/lib/jvm/java-17-openjdk-amd64"
          SDK_PATH="/usr/lib/android-sdk"
          export JAVA_HOME="$JAVA_HOME_PATH"
          export ANDROID_HOME="$SDK_PATH"
          export ANDROID_SDK_ROOT="$SDK_PATH"

          cat << EOF > /root/.config/godot/editor_settings-4.4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/debug_keystore = "/root/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/java_sdk_path = "$JAVA_HOME_PATH"
          export/android/android_sdk_path = "$SDK_PATH"
          EOF

          if [ -f export_presets.cfg ]; then
            grep -v -E '^(keystore/debug=|keystore/debug_user=|keystore/debug_password=|keystore/release=|keystore/release_user=|keystore/release_password=)' export_presets.cfg > /tmp/export_presets.cfg.tmp
            cat << 'EOF' >> /tmp/export_presets.cfg.tmp
          keystore/debug="/root/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release="/root/.android/debug.keystore"
          keystore/release_user="androiddebugkey"
          keystore/release_password="android"
          EOF
            mv /tmp/export_presets.cfg.tmp export_presets.cfg
          fi

          echo "=== FULL export_presets.cfg ==="
          cat export_presets.cfg || true

          godot --headless --verbose --export-debug "Android" build/spatial_simulator.apk
