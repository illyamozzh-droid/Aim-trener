name: Android Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup and Export
        run: |
          mkdir -p /root/.android /github/home/.local/share/godot/export_templates/4.4.1.stable /github/home/.config/godot /root/.config/godot build
          if [ ! -f /root/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore /root/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          sed -i 's|/home/runner/.android/debug.keystore|/root/.android/debug.keystore|g' export_presets.cfg

          for src in /root/.local/share/godot/export_templates/4.4.1.stable /root/.local/share/godot/export_templates/4.4.1.stable.mono /usr/local/share/godot/templates/4.4.1.stable; do
            if [ -d "$src" ]; then
              cp -rn "$src"/* /github/home/.local/share/godot/export_templates/4.4.1.stable/ 2>/dev/null || true
            fi
          done

          JAVA_BIN=$(command -v java || true)
          JAVA_HOME_PATH=""
          if [ -n "$JAVA_BIN" ]; then
            JAVA_HOME_PATH=$(dirname "$(dirname "$(readlink -f "$JAVA_BIN")")")
          fi

          SDK_PATH=""
          ADB_FOUND=$(find / -name "adb" -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$ADB_FOUND" ]; then
            SDK_PATH=$(dirname "$(dirname "$ADB_FOUND")")
          fi

          cat << EOF > /github/home/.config/godot/editor_settings-4.4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/debug_keystore = "/root/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/java_sdk_path = "$JAVA_HOME_PATH"
          export/android/android_sdk_path = "$SDK_PATH"
          EOF
          cp /github/home/.config/godot/editor_settings-4.4.tres /root/.config/godot/editor_settings-4.4.tres

          echo "=== JAVA: $JAVA_HOME_PATH | SDK: $SDK_PATH ==="
          cat /github/home/.config/godot/editor_settings-4.4.tres
          ls -la /github/home/.local/share/godot/export_templates/4.4.1.stable/ || true

          godot --headless --verbose --export-debug "Android" build/spatial_simulator.apk
